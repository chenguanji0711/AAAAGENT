<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self' pet:; script-src 'self' pet: 'wasm-unsafe-eval'; style-src 'self' pet:; img-src 'self' pet: blob:; connect-src 'self' pet: blob:; media-src 'self' pet: blob:; worker-src blob:"><title>AAAAGENT</title><link rel="stylesheet" href="style.css"></head><body>
<button id="pet-ball" type="button" aria-label="展开桌宠；拖动可移动" title="展开桌宠" hidden><span aria-hidden="true">✦</span></button><main id="pet"><button id="pet-collapse" type="button" aria-label="收为小球" title="收为小球">−</button><div id="character" title="点击打开对话"><canvas id="model" aria-label="AAAAGENT桌宠，点击聊天，拖动移动"></canvas><span id="thinking-indicator" role="status" aria-live="polite" hidden><span class="thinking-orbit" aria-hidden="true"><span>✦</span></span><span>想一想…</span></span><span id="loading">AAAAGENT正在过来…</span></div><button id="work-badge" type="button" aria-live="polite" aria-controls="work-card" aria-expanded="false" hidden></button><button id="invitation" hidden></button><button id="model-resize" type="button" aria-label="拖动调整模型大小；方向键也可调整" data-resizing="false"></button><div id="capture-feedback" hidden aria-label="语音输入状态"><span id="capture-connecting" role="status">正在连接语音</span><span id="capture-wave" hidden><svg viewBox="0 0 160 24" role="img" aria-label="实时输入音量"><path id="capture-wave-path" d=""></path></svg></span></div><button id="open" aria-label="打开对话" aria-controls="drawer" aria-expanded="false" hidden>聊一会儿</button><section id="speech-bubble" aria-label="桌宠聊天栏"><header><span>她的话</span><button id="speech-hide" type="button" aria-label="隐藏聊天栏" title="隐藏聊天栏">×</button></header><div id="speech-text" role="status" aria-live="polite" aria-atomic="true">我在这里，想聊什么？</div></section><div id="hud-restore" aria-label="桌宠聊天控制"><button id="speech-show" type="button" aria-controls="speech-bubble" hidden>显示聊天栏</button><button id="quick-show" type="button" aria-controls="quick-chat" hidden>显示输入框</button></div><div id="quick-chat" aria-label="快捷消息"><label class="sr-only" for="quick-text">快捷消息</label><textarea id="quick-text" rows="1" autocomplete="off" placeholder="和她说点什么…（Enter 发送，Shift+Enter 换行）"></textarea><button id="quick-send" type="button" aria-label="发送快捷消息" title="发送（Enter）">↑</button><button id="quick-hide" type="button" aria-label="隐藏快捷输入框" title="隐藏输入框">×</button></div></main>
<section id="drawer" hidden aria-label="对话面板">
 <header><div class="panel-title"><span class="presence-dot" aria-hidden="true"></span><strong>青梅竹马</strong></div><button id="management" type="button" title="打开网页控制台" aria-label="打开网页控制台">控制台</button><div id="display-controls" role="group" aria-label="展示模式"><button id="view-full" type="button" aria-pressed="true">全身</button><button id="view-half" type="button" aria-pressed="false">半身</button></div><button id="close" aria-label="收起对话">×</button></header>
 <div id="motion-settings" aria-label="动作设置">
  <label for="motion-animation">动作</label><select id="motion-animation"><option value="Idle">待机</option><option value="Breathing">呼吸</option><option value="Blink">眨眼</option><option value="LookAt">注视</option><option value="Talking">说话</option><option value="Happy">开心</option><option value="Surprised">惊讶</option><option value="Shy">害羞</option><option value="Sleep">睡觉</option><option value="Drag">拖动</option><option value="Interact">互动</option></select>
  <label for="motion-amount">幅度</label><input id="motion-amount" type="range" min="0" max="1" step="0.05" value="0.6">
  <label for="motion-speed">速度</label><input id="motion-speed" type="range" min="0.2" max="2" step="0.05" value="0.75">
  <label for="motion-frequency">频率</label><input id="motion-frequency" type="range" min="0" max="2" step="0.05" value="1">
  <label for="motion-tracking"><input id="motion-tracking" type="checkbox" checked>跟随鼠标</label>
  <label for="motion-rate">帧率预算</label><select id="motion-rate"><option value="60">60Hz</option><option value="high">跟随刷新率</option><option value="eco">省电 30Hz</option></select>
  <label for="motion-random"><input id="motion-random" type="checkbox" checked>随机动作</label>
  <select id="motion-random-interval" aria-label="随机动作频率"></select>
  <button id="motion-fit-drawer" type="button" title="把模型放大到与对话框同高">模型与对话框同高</button>
  <output id="motion-stats" aria-live="off">帧率 — · 帧时 —</output>
</div>
<div id="model-settings"><label for="model-kind">角色</label><select id="model-kind"><option value="video">视频鲸鱼</option><option value="live2d">Live2D</option></select><span id="video-controls"><select id="video-action" aria-label="视频动作"></select><button id="video-play" type="button">播放</button><button id="video-reassure" type="button">安抚</button></span></div>
 <p id="management-notice" role="status" hidden></p>
 <p id="status" role="status">正在连接…</p>
 <div id="workbench-launch"><button id="workbench-open" type="button" aria-haspopup="dialog" aria-controls="workbench-dialog">工程速览</button><span id="workbench-summary" role="status">连接后读取项目与任务</span></div>
 <section id="conversation" aria-label="对话与任务内容" tabindex="0">
 <div id="reply" role="log" aria-live="polite" aria-label="聊天记录与开场"></div>
 <section id="workbench-source" aria-label="当前工程原话" hidden></section>
 <section id="work-card" aria-label="工程转交与回执" hidden></section>
 </section>
 <section id="work-actions" aria-label="任务操作" hidden></section>
 <form id="form"><label class="sr-only" for="text">想说的话</label><textarea id="text" rows="1" autocomplete="off" placeholder="想说些什么…"></textarea><button type="submit" id="send" aria-label="发送">↑</button></form>
 <footer><button id="voice">开始语音</button><button id="stop" hidden>停止</button><span id="hint">语音使用麦克风与摄像头</span><button id="quit" aria-label="退出桌宠">退出</button></footer>
 <div id="hotkey-settings"><span>输入框外按住发言 · <b id="hotkey-value">未绑定</b></span><button id="hotkey-bind" type="button">设置按键</button><button id="hotkey-clear" type="button">清除</button><span class="input-tip">Enter 发送 · Shift + Enter 换行</span></div>
 <div id="audio-settings" role="group" aria-label="声音"><button id="audio-toggle" type="button" aria-pressed="false" title="静音">🔊</button><input id="audio-volume" type="range" min="0" max="100" step="5" value="100" aria-label="音量"><span id="audio-note">静音时台词与语音回复都不出声</span></div>
</section>
<dialog id="work-records-dialog" aria-labelledby="work-records-title"><header><h2 id="work-records-title">工程记录</h2><div class="pet-window-actions"><button id="work-records-collapse" type="button" aria-label="收为小球" title="收为小球">−</button><button id="work-records-close" type="button" aria-label="关闭工程记录">×</button></div></header><div id="work-records-content" tabindex="0" aria-label="任务问答与执行详情"></div></dialog>
<dialog id="workbench-dialog" aria-labelledby="workbench-title"><header><h2 id="workbench-title">工程速览</h2><div class="pet-window-actions"><button id="workbench-collapse" type="button" aria-label="收为小球" title="收为小球">−</button><button id="workbench-close" type="button" aria-label="关闭工程速览">×</button></div></header><div id="workbench-content" tabindex="0" aria-label="项目摘要、原生入口和简短回应"></div><div id="workbench-footer" aria-label="速览操作"></div></dialog>
<script type="module" src="build/renderer.js"></script></body></html>
